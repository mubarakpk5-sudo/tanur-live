<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>താനൂർ ബ്ലോക്ക് - ബാഡ്മിൻറൺ LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f0f7f0}
header{background:#0a7a42;color:#fff;padding:18px;text-align:center;position:sticky;top:0;z-index:10}
header h1{font-size:20px}
.live-badge{background:#ff2222;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.tabs{display:flex;overflow-x:auto;background:#fff;padding:8px;gap:8px;position:sticky;top:76px;z-index:9}
.tabs button{white-space:nowrap;border:2px solid #0a7a42;background:#fff;color:#0a7a42;padding:10px 13px;border-radius:20px;font-weight:bold;cursor:pointer}
.tabs button.active{background:#0a7a42;color:#fff}
.container{padding:12px;max-width:700px;margin:auto}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card h2{font-size:17px;margin-bottom:10px;color:#0a7a42}
.teams{display:flex;justify-content:space-between;align-items:center;text-align:center}
.team{width:40%;font-weight:bold;font-size:16px}
.score{font-size:48px;font-weight:bold;color:#0a7a42;margin:8px 0;text-align:center}
.sets{font-size:14px;background:#e8f5e9;padding:8px;border-radius:8px;text-align:center}
.status{margin-top:10px;color:#ff2222;font-weight:bold;text-align:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 6px;text-align:left;border-bottom:1px solid #eee}
th{background:#0a7a42;color:#fff}
.match{padding:10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;font-size:14px}
.admin-btn{display:block;width:100%;padding:14px;background:#111;color:#fff;border:none;border-radius:10px;font-size:16px;margin:15px 0;cursor:pointer}
.winner{background:#fff3cd;border:2px dashed #ffb300;text-align:center;padding:14px;border-radius:14px;font-weight:bold;margin-bottom:14px}
input,select{width:100%;padding:11px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font-size:15px}
.save{background:#0a7a42;color:#fff;border:none;padding:13px;border-radius:10px;width:100%;font-size:16px;font-weight:bold;cursor:pointer}
#adminPanel{display:none}
.note{font-size:12px;color:#666;text-align:center}
</style>
</head>
<body>
<header><h1>🏸 താനൂർ ബ്ലോക്ക് പഞ്ചായത്ത്</h1><p>കേരളോത്സവം - ബാഡ്മിൻറൺ ടൂർണമെന്റ്</p><p style="margin-top:8px"><span class="live-badge">● LIVE</span></p></header>
<div class="tabs" id="tabs"></div>
<div class="container">
<div id="winnerBox"></div>
<div class="card"><h2>🔴 LIVE SCORE - <span id="catTitle"></span></h2>
<div class="teams"><div class="team" id="teamA">-</div><div>VS</div><div class="team" id="teamB">-</div></div>
<div class="score" id="liveScore">0 - 0</div>
<div class="sets" id="setScore"></div>
<div class="status" id="matchStatus"></div></div>
<div class="card"><h2>📊 Points Table - <span class="catName"></span></h2><table><thead><tr><th>Team</th><th>P</th><th>W</th><th>L</th><th>Pts</th></tr></thead><tbody id="pointsBody"></tbody></table></div>
<div class="card"><h2>📅 Upcoming Matches</h2><div id="matchesList"></div></div>
<button class="admin-btn" onclick="openAdmin()">🔐 Admin Login</button>
<div class="card" id="adminPanel"><h2>Admin Panel</h2>
<div id="loginBox"><input id="u" placeholder="Username - admin"><input id="p" type="password" placeholder="Password - 1234"><button class="save" onclick="login()">Login</button></div>
<div id="controlBox" style="display:none">
<label>Category</label><select id="admCat" onchange="loadAdmin()"></select>
<label>Team A</label><select id="admA"></select>
<label>Team B</label><select id="admB"></select>
<label>Score A</label><input id="admScoreA" type="number" value="0">
<label>Score B</label><input id="admScoreB" type="number" value="0">
<label>Set 1 (Ex: 21-18)</label><input id="admS1" placeholder="21-18">
<label>Set 2</label><input id="admS2" placeholder="18-21">
<label>Set 3</label><input id="admS3" placeholder="-">
<label>Status</label><input id="admStatus" placeholder="Set 1 Live / Finished">
<label>Winner Team</label><input id="admWinner" placeholder="Team Name">
<button class="save" onclick="saveLive()">✅ Save Live Score</button>
<p style="margin:12px 0 6px;font-weight:bold">Points Table Update</p>
<label>Select Team</label><select id="admTeamPts" onchange="loadPts()"></select>
<label>Played</label><input id="ptsP" type="number" value="0">
<label>Won</label><input id="ptsW" type="number" value="0">
<label>Lost</label><input id="ptsL" type="number" value="0">
<label>Points</label><input id="ptsPts" type="number" value="0">
<button class="save" style="background:#ff9800" onclick="savePoints()">💾 Save Points</button>
</div></div>
<p class="note">Live score കാണാൻ പേജ് Refresh ചെയ്യുക</p>
</div>
<script>
const TEAMS=["നിറമെരുതൂർ","പെരുമണ്ണ","പൊന്മുണ്ടം","താനാളൂർ","വളവന്നൂർ","ഒഴൂർ","ചെറിയമുണ്ടം"];
const CATS=["Boys Doubles","Boys Singles","Girls Doubles","Girls Singles"];
let current=0;
let data=JSON.parse(localStorage.getItem("tanur_badminton_only")||"null");
if(!data){data={};CATS.forEach(c=>{data[c]={live:{a:"താനാളൂർ",b:"പൊന്മുണ്ടം",sa:0,sb:0,s1:"-",s2:"-",s3:"-",status:"Match Not Started",winner:""},points:{},matches:[["നിറമെരുതൂർ","പെരുമണ്ണ"],["പൊന്മുണ്ടം","താനാളൂർ"],["വളവന്നൂർ","ഒഴൂർ"],["ചെറിയമുണ്ടം","നിറമെരുതൂർ"]]};TEAMS.forEach(t=>data[c].points[t]={p:0,w:0,l:0,pts:0});});save();}
function save(){localStorage.setItem("tanur_badminton_only",JSON.stringify(data));}
function renderTabs(){document.getElementById("tabs").innerHTML=CATS.map((c,i)=>`<button class="${i==current?'active':''}" onclick="setCat(${i})">${c}</button>`).join("");}
function setCat(i){current=i;render();}
function render(){renderTabs();let c=CATS[current],d=data[c];document.getElementById("catTitle").innerText=c;document.querySelectorAll(".catName").forEach(e=>e.innerText=c);document.getElementById("teamA").innerText=d.live.a;document.getElementById("teamB").innerText=d.live.b;document.getElementById("liveScore").innerText=d.live.sa+" - "+d.live.sb;document.getElementById("setScore").innerText=`Set 1 : ${d.live.s1} | Set 2 : ${d.live.s2} | Set 3 : ${d.live.s3}`;document.getElementById("matchStatus").innerText=d.live.status;document.getElementById("winnerBox").innerHTML=d.live.winner?`<div class="winner">🏆 Winner - ${c} : ${d.live.winner}</div>`:"";let sorted=TEAMS.map(t=>({name:t,...d.points[t]})).sort((a,b)=>b.pts-a.pts);document.getElementById("pointsBody").innerHTML=sorted.map(t=>`<tr><td>${t.name}</td><td>${t.p}</td><td>${t.w}</td><td>${t.l}</td><td><b>${t.pts}</b></td></tr>`).join("");document.getElementById("matchesList").innerHTML=d.matches.map(m=>`<div class="match"><span>${m[0]} vs ${m[1]}</span><span>Upcoming</span></div>`).join("");}
function openAdmin(){document.getElementById("adminPanel").style.display="block";document.getElementById("adminPanel").scrollIntoView({behavior:"smooth"});}
function login(){if(document.getElementById("u").value=="admin"&&document.getElementById("p").value=="1234"){document.getElementById("loginBox").style.display="none";document.getElementById("controlBox").style.display="block";document.getElementById("admCat").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");loadAdmin();alert("Login Success!");}else alert("Wrong Password");}
function fillTeams(id){document.getElementById(id).innerHTML=TEAMS.map(t=>`<option>${t}</option>`).join("");}
function loadAdmin(){let c=document.getElementById("admCat").value,d=data[c];fillTeams("admA");fillTeams("admB");fillTeams("admTeamPts");document.getElementById("admA").value=d.live.a;document.getElementById("admB").value=d.live.b;document.getElementById("admScoreA").value=d.live.sa;document.getElementById("admScoreB").value=d.live.sb;document.getElementById("admS1").value=d.live.s1;document.getElementById("admS2").value=d.live.s2;document.getElementById("admS3").value=d.live.s3;document.getElementById("admStatus").value=d.live.status;document.getElementById("admWinner").value=d.live.winner;loadPts();}
function loadPts(){let c=document.getElementById("admCat").value,t=document.getElementById("admTeamPts").value,p=data[c].points[t];if(p){document.getElementById("ptsP").value=p.p;document.getElementById("ptsW").value=p.w;document.getElementById("ptsL").value=p.l;document.getElementById("ptsPts").value=p.pts;}}
function saveLive(){let c=document.getElementById("admCat").value;data[c].live={a:document.getElementById("admA").value,b:document.getElementById("admB").value,sa:document.getElementById("admScoreA").value,sb:document.getElementById("admScoreB").value,s1:document.getElementById("admS1").value,s2:document.getElementById("admS2").value,s3:document.getElementById("admS3").value,status:document.getElementById("admStatus").value,winner:document.getElementById("admWinner").value};save();render();alert("Updated!");}
function savePoints(){let c=document.getElementById("admCat").value,t=document.getElementById("admTeamPts").value;data[c].points[t]={p:+document.getElementById("ptsP").value,w:+document.getElementById("ptsW").value,l:+document.getElementById("ptsL").value,pts:+document.getElementById("ptsPts").value};save();render();alert("Points Updated!");}
render();
</script>
</body>
</html>
